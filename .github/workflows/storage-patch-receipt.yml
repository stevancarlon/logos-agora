name: Patched Storage public receipt
on:
  workflow_dispatch:
  push:
    branches: [codex/public-network-verification]
    paths: [patches/logos-storage-0.5.3-public-download.patch, .github/workflows/storage-patch-receipt.yml]
permissions:
  contents: read
jobs:
  receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Storage with public download correction
        shell: bash
        run: |
          git clone --branch v0.5.3 --depth 1 https://github.com/logos-storage/logos-storage-nim.git "$RUNNER_TEMP/storage-source"
          cd "$RUNNER_TEMP/storage-source"
          test "$(git rev-parse HEAD)" = 56854f4ebce0cfe68e3557d1be21b758ac62ae0c
          git submodule update --init --depth 1
          git submodule foreach 'if [ "$sm_path" != "vendor/nimbus-build-system" ]; then git submodule update --init --recursive --depth 1; fi'
          git apply "$GITHUB_WORKSPACE/patches/logos-storage-0.5.3-public-download.patch"
          curl --fail --location --max-time 120 --output "$RUNNER_TEMP/nim.tar.xz" https://nim-lang.org/download/nim-2.2.10-linux_x64.tar.xz
          echo "0a3a38752e97e9d44aa479b3a7b37336dfe0176daf22ee5b5218ad0991ecd211  $RUNNER_TEMP/nim.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/nim.tar.xz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/nim-2.2.10/bin:$PATH"
          echo "$RUNNER_TEMP/nim-2.2.10/bin" >> "$GITHUB_PATH"
          make USE_SYSTEM_NIM=1 NIM_PARAMS="-d:release -d:agoraRelayOnly" -j2 > "$RUNNER_TEMP/storage-build.log" 2>&1
      - name: Run download swarm regressions
        shell: bash
        run: |
          cd "$RUNNER_TEMP/storage-source"
          USE_SYSTEM_NIM=1 ./env.sh nim c -r -d:release --out:build/testswarm tests/storage/blockexchange/engine/testswarm.nim > "$RUNNER_TEMP/storage-tests.log" 2>&1
      - name: Retrieve public fixtures without manual peer connection
        shell: bash
        run: |
          python3 scripts/storage-network-config.py --mix --output "$RUNNER_TEMP/storage-public.toml" > "$RUNNER_TEMP/storage-fleet.json"
          python3 scripts/check-storage-receipt.py --config-file "$RUNNER_TEMP/storage-public.toml" --storage "$RUNNER_TEMP/storage-source/build/storage" --manifest docs/evidence/storage-fixtures-20261030.json --output "$RUNNER_TEMP/receipt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-storage-receipt
          path: |
            ${{ runner.temp }}/receipt/
            ${{ runner.temp }}/storage-build.log
            ${{ runner.temp }}/storage-tests.log
            ${{ runner.temp }}/storage-fleet.json
            ${{ runner.temp }}/storage-public.toml
          if-no-files-found: warn
