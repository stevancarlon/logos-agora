name: Patched Storage public receipt
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Storage with public download correction
        shell: bash
        run: |
          git clone --branch v0.5.3 --depth 1 https://github.com/logos-storage/logos-storage-nim.git "$RUNNER_TEMP/storage-source"
          cd "$RUNNER_TEMP/storage-source"
          test "$(git rev-parse HEAD)" = 56854f4ebce0cfe68e3557d1be21b758ac62ae0c
          git apply "$GITHUB_WORKSPACE/patches/logos-storage-0.5.3-public-download.patch"
          make -j2 > "$RUNNER_TEMP/storage-build.log" 2>&1
      - name: Run download swarm regressions
        shell: bash
        run: |
          cd "$RUNNER_TEMP/storage-source"
          ./env.sh nim c -r -d:release --out:build/testswarm tests/storage/blockexchange/engine/testswarm.nim > "$RUNNER_TEMP/storage-tests.log" 2>&1
      - name: Retrieve public fixtures without manual peer connection
        shell: bash
        run: |
          python3 scripts/check-storage-receipt.py --storage "$RUNNER_TEMP/storage-source/build/storage" --manifest docs/evidence/storage-fixtures-20261030.json --output "$RUNNER_TEMP/receipt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-storage-receipt
          path: |
            ${{ runner.temp }}/receipt/
            ${{ runner.temp }}/storage-build.log
            ${{ runner.temp }}/storage-tests.log
          if-no-files-found: warn
