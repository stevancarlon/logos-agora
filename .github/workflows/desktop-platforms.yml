name: Desktop platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install openssl@3
      - run: pip install aqtinstall==3.3.0
      - run: python -m aqt install-qt mac desktop 6.9.2 clang_64 -O "$RUNNER_TEMP/Qt" --modules qtmultimedia --archives qtbase qtdeclarative qtmultimedia
      - name: Build and test native application
        run: OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" QMAKE="$RUNNER_TEMP/Qt/6.9.2/macos/bin/qmake" python3 scripts/build-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            native/forum/*.dylib
            build/qt6.9.2-media/qml/
      - uses: actions/checkout@v4
        if: matrix.runner == 'macos-15'
        with:
          repository: logos-co/logos-package
          ref: c25a1167578aef5cbd9a9b6f822ffe2ae4fd6a89
          path: .tools/logos-package
      - name: Build official validator and Apple Silicon installation kit
        if: matrix.runner == 'macos-15'
        run: |
          brew install libsodium icu4c nlohmann-json pkg-config
          cmake -S .tools/logos-package -B "$RUNNER_TEMP/lgx" -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-L$(brew --prefix libsodium)/lib"
          cmake --build "$RUNNER_TEMP/lgx" --target lgx --parallel 3
          python3 scripts/build-release.py --variant darwin-arm64 --lgx "$RUNNER_TEMP/lgx/lgx"
      - name: Inspect official Apple Silicon Basecamp runtime
        if: matrix.runner == 'macos-15'
        run: |
          curl --fail --location --output "$RUNNER_TEMP/basecamp.dmg" https://github.com/logos-co/logos-basecamp/releases/download/0.3.2/LogosBasecamp-Desktop-v0.3.2-f2fae6-aarch64.dmg
          mkdir "$RUNNER_TEMP/basecamp-volume"
          hdiutil attach "$RUNNER_TEMP/basecamp.dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/basecamp-volume"
          app=$(find "$RUNNER_TEMP/basecamp-volume" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          python3 scripts/inspect-macos-host.py --app "$app" --output "$RUNNER_TEMP/basecamp-runtime.json"
          mkdir -p "$RUNNER_TEMP/agora-profile"
          touch "$RUNNER_TEMP/agora-profile/.agora-disposable-profile"
          kit=$(find artifacts -maxdepth 1 -name 'agora-*-darwin-arm64.tar.gz' -print -quit)
          python3 scripts/check-desktop-kit-install.py --archive "$kit" --qt "$RUNNER_TEMP/Qt/6.9.2/macos" --app "$app" --profile "$RUNNER_TEMP/agora-profile" --runtime-dir "$RUNNER_TEMP/agora-runtime" --launcher "$RUNNER_TEMP/launch-agora" --output "$RUNNER_TEMP/agora-kit-check"
          python3 scripts/install-test-delivery.py --profile "$RUNNER_TEMP/agora-profile"
          python3 scripts/prepare-host-video.py --profile "$RUNNER_TEMP/agora-profile"
          python3 scripts/check-macos-host.py --launcher "$RUNNER_TEMP/launch-agora" --profile "$RUNNER_TEMP/agora-profile" --output "$RUNNER_TEMP/agora-host-check" --video
          hdiutil detach "$RUNNER_TEMP/basecamp-volume"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.runner == 'macos-15'
        with:
          name: basecamp-arm64-runtime-inspection
          path: |
            ${{ runner.temp }}/basecamp-runtime.json
            ${{ runner.temp }}/agora-host-check/
            ${{ runner.temp }}/agora-kit-check/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && matrix.runner == 'macos-15'
        with:
          name: agora-kit-darwin-arm64-development
          if-no-files-found: error
          path: |
            artifacts/agora-*-darwin-arm64.tar.gz*
            artifacts/logos_forum-*-darwin-arm64.lgx
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install aqtinstall==3.3.0
      - run: python -m aqt install-qt windows desktop 6.9.2 win64_mingw -O "$env:RUNNER_TEMP/Qt" --modules qtmultimedia --archives qtbase qtdeclarative qtmultimedia
      - run: python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 -O "$env:RUNNER_TEMP/Qt"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-openssl
      - name: Build and test native application
        env:
          OPENSSL_ROOT_DIR: ${{ steps.msys2.outputs.msys2-location }}/mingw64
        run: |
          $env:QMAKE = "$env:RUNNER_TEMP/Qt/6.9.2/mingw_64/bin/qmake.exe"
          $env:MAKE = "$env:RUNNER_TEMP/Qt/Tools/mingw1310_64/bin/mingw32-make.exe"
          $env:PATH = "$env:RUNNER_TEMP/Qt/Tools/mingw1310_64/bin;$env:PATH"
          python scripts/build-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-build-windows-amd64
          if-no-files-found: error
          path: |
            native/forum/*.dll
            build/qt6.9.2-media/qml/
      - name: Load Agora in official Windows Basecamp
        run: |
          Invoke-WebRequest -Uri 'https://github.com/logos-co/logos-basecamp/releases/download/0.3.2/LogosBasecamp-Desktop-v0.3.2-f2fae6-x86_64-setup.exe' -OutFile "$env:RUNNER_TEMP/basecamp-setup.exe"
          & "$env:ProgramFiles/7-Zip/7z.exe" x "$env:RUNNER_TEMP/basecamp-setup.exe" "-o$env:RUNNER_TEMP/basecamp-extracted" -y
          if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/agora-profile" | Out-Null
          New-Item -ItemType File "$env:RUNNER_TEMP/agora-profile/.agora-disposable-profile" | Out-Null
          python scripts/install-basecamp.py --user-dir "$env:RUNNER_TEMP/agora-profile"
          if ($LASTEXITCODE -ne 0) { throw 'Agora installation failed' }
          python scripts/install-test-delivery.py --profile "$env:RUNNER_TEMP/agora-profile"
          if ($LASTEXITCODE -ne 0) { throw 'Delivery installation failed' }
          python scripts/prepare-host-video.py --profile "$env:RUNNER_TEMP/agora-profile"
          if ($LASTEXITCODE -ne 0) { throw 'Video probe installation failed' }
          python scripts/stage-windows-runtime.py --qt "$env:RUNNER_TEMP/Qt/6.9.2/mingw_64" --host-bin "$env:RUNNER_TEMP/basecamp-extracted/bin" --user-dir "$env:RUNNER_TEMP/agora-profile" --runtime-dir "$env:RUNNER_TEMP/agora-runtime" --launcher "$env:RUNNER_TEMP/Launch-Agora.cmd"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency staging failed' }
          python scripts/inspect-pe-symbols.py --host-bin "$env:RUNNER_TEMP/basecamp-extracted/bin" --runtime-dir "$env:RUNNER_TEMP/agora-runtime" --backend "$env:RUNNER_TEMP/agora-profile/plugins/logos_forum/forum_backend.dll" --output "$env:RUNNER_TEMP/agora-runtime/symbols.json"
          python scripts/check-windows-host.py --host-bin "$env:RUNNER_TEMP/basecamp-extracted/bin" --runtime-dir "$env:RUNNER_TEMP/agora-runtime" --profile "$env:RUNNER_TEMP/agora-profile" --output "$env:RUNNER_TEMP/agora-windows-host-check" --video
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basecamp-windows-host-check
          path: |
            ${{ runner.temp }}/agora-windows-host-check/
            ${{ runner.temp }}/agora-runtime/dependencies.json
            ${{ runner.temp }}/agora-runtime/symbols.json
          if-no-files-found: warn
